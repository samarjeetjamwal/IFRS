            `;
            card.addEventListener('click', () => openModal(std.code));
            grid.appendChild(card);
        });

        section.appendChild(grid);
        categoryGrid.appendChild(section);
    });

    // ------------------------------------------------------------------
    // 4. MODAL LOGIC
    // ------------------------------------------------------------------
    const overlay = document.getElementById('modalOverlay');
    const modalTitle = document.getElementById('modalTitle');
    const modalBody = document.getElementById('modalBody');
    const closeBtn = document.getElementById('closeModalBtn');

    function openModal(code) {
        const detail = details[code];

        if (!detail) {
            modalTitle.innerHTML = `${code} <small>Standard</small>`;
            modalBody.innerHTML = `
                <h3>📄 Literature</h3>
                <p>Detailed literature for ${code} is not available in this demo.</p>
                <div class="example-box">
                    <strong>Note:</strong> This standard is part of the active IFRS/IAS framework, but examples are not included in this version.
                </div>
            `;
            overlay.classList.add('active');
            return;
        }

        // Title
        modalTitle.innerHTML = `${code} <small>${detail.fullTitle}</small>`;

        // Body
        let html = '';

        // Interview Answer (first, most prominent)
        html += `<div class="interview-box">`;
        html += `<p>${detail.interviewAnswer}</p>`;
        html += `</div>`;

        // Literature
        html += `<h3>📄 Full literature (simplified)</h3>`;
        html += `<ul>`;
        detail.literature.forEach(item => {
            html += `<li>${item}</li>`;
        });
        html += `</ul>`;

        // Examples
        html += `<h3>🧾 Five simple accounting examples</h3>`;
        detail.examples.forEach((ex) => {
            let formatted = ex.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            html += `<div class="example-box">`;
            html += `<p>${formatted}</p>`;
            html += `</div>`;
        });

        // Notes for specific standards
        if (code === 'IFRS 18') {
            html += `<div class="note">⚠️ IFRS 18 is effective for annual reporting periods beginning on or after 1 January 2027. Early application is permitted.</div>`;
        }
        if (code === 'IFRS 17') {
            html += `<div class="note">⚠️ IFRS 17 is effective for annual periods beginning on or after 1 January 2023.</div>`;
        }
        if (code === 'IAS 18') {
            html += `<div class="note">⚠️ IAS 18 has been superseded by IFRS 15 for periods beginning on or after 1 January 2018.</div>`;
        }
        if (code === 'IAS 39') {
            html += `<div class="note">⚠️ IAS 39 has largely been replaced by IFRS 9. Some entities may still apply IAS 39 for certain hedge accounting.</div>`;
        }

        modalBody.innerHTML = html;
        overlay.classList.add('active');
    }

    function closeModal() {
        overlay.classList.remove('active');
    }

    closeBtn.addEventListener('click', closeModal);
    overlay.addEventListener('click', (e) => {
        if (e.target === overlay) closeModal();
    });

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && overlay.classList.contains('active')) {
            closeModal();
        }
    });
</script>
</body>
</html>
